---
layout: default
---
<article class="page{% if page.wide %} wide{% endif %}">
  {%- unless page.hide_title %}
  <h1 class="page-title"{% if page.title_key %} data-i18n="{{ page.title_key }}"{% endif %}>{{ page.title }}</h1>
  {%- endunless %}
  <div class="page-body">
    {{ content }}
  </div>
</article>

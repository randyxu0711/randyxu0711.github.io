<dialog class="book" id="book" aria-label="書" data-i18n-attr="aria-label:books.dialog">
  <div class="book-stage" id="book-stage">
    <div class="slab book-card">
        <div class="cover" id="b-cover">
          <img id="b-img" alt="" hidden data-proofer-ignore>
          <span class="cover-fallback"><span class="ti" id="b-cti"></span><span class="au" id="b-cau"></span></span>
        </div>
        <div class="book-info">
          <h2 id="b-title"></h2>
          <div class="by" id="b-author"></div>
          <div class="stars" id="b-stars"></div>
          <div class="facts" id="b-pages"></div>
          <a class="gr" id="b-gr" href="https://www.goodreads.com/" target="_blank" rel="noopener" data-i18n="books.goodreads">在 Goodreads 查看</a>
        </div>
    </div>
    <button type="button" class="key round closebtn" id="b-close" aria-label="闔上" data-i18n-attr="aria-label:books.close">×</button>
  </div>
  <div class="book-nav">
    <button type="button" class="key round" id="b-prev" aria-label="上一本" data-i18n-attr="aria-label:books.prev">‹</button>
    <span class="pos" id="b-pos"></span>
    <button type="button" class="key round" id="b-next" aria-label="下一本" data-i18n-attr="aria-label:books.next">›</button>
  </div>
</dialog>

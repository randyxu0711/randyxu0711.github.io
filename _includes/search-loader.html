<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <div class="search-card">
      <div class="search-thumb">{image}</div>
      <div class="search-body">
        <h2><a href="{url}" target="_blank" rel="noopener">{title}</a></h2>
        <div class="search-meta text-muted">{source}{tags}</div>
        <p class="search-summary">{summary}</p>
      </div>
    </div>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {% comment %} Note: dependent library will be loaded in `js-selector.html` {% endcomment %}
  document.addEventListener('DOMContentLoaded', () => {
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      exclude: ['image'],
      templateMiddleware: function(prop, value, template) {
        if (prop === 'image') {
          return value === '' ? '' : `<img src="${value}" alt="" loading="lazy" onerror="this.parentElement.remove()">`;
        }

        if (prop === 'source') {
          return value === '' ? '' : `<span class="me-3"><i class="fas fa-link fa-fw"></i>${value}</span>`;
        }

        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<span><i class="fa fa-tag fa-fw"></i>${value}</span>`;
          }
        }
      }
    });
  });
</script>

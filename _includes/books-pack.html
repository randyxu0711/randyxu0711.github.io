{%- comment -%}
  依寬度把每層的書分到多個隔間(一行書一個隔間),並把封面寬度微調成剛好排滿一行。
  放在書架開頭定義 window.booksPack;每一層讀完就由該層後面的行內 script 分好並顯示(.tier.packed),
  不用等整頁(書單 HTML 很大,手機上解析完要好幾秒)或 books.js(defer)載入。
  books.js 換排法、寬度改變時呼叫同一個函式。
{%- endcomment -%}
<script>
  (function () {
    var root = document.getElementById('books');
    if (!root) return;
    var GAP = 3;          // .row 的 gap(px)
    var PAD = 2 * 17.6;   // .row 左右 padding 1.1rem
    var cabHTML = null;   // 層板的標記:第一次分格時從還沒拆開的那一格複製(這段 script 跑的時候書架還沒讀到)

    // 封面寬的基準(books.css 的 --w-base)。要在改任何東西之前讀:改過再讀,瀏覽器得先把全部書的樣式重算一遍
    function baseWidth() {
      var v = getComputedStyle(root).getPropertyValue('--w-base').trim();
      return v.indexOf('rem') > -1 ? parseFloat(v) * parseFloat(getComputedStyle(document.documentElement).fontSize) : parseFloat(v);
    }
    // 封面寬度:依隔間寬度把基準微調成剛好排滿一行(手機上 2 本多一點 → 3 本)
    function fitWidth(avail, base) {
      if (avail <= base) { root.style.removeProperty('--w'); return base; }   // 隔間還沒有寬度(或窄到放不下一本)就用基準
      var n = Math.max(1, Math.round((avail + GAP) / (base + GAP)));
      var w = Math.floor((avail - (n - 1) * GAP) / n);
      if (root.style.getPropertyValue('--w') !== w + 'px') root.style.setProperty('--w', w + 'px');
      return w;
    }
    // forView:spines / covers(省略 = 目前的排法);bays:只分這些隔間(省略 = 全部)
    window.booksPack = function (forView, bays) {
      forView = forView || (root.getAttribute('data-view') === 'spines' ? 'spines' : 'covers');
      if (cabHTML === null) {
        var firstRow = root.querySelector('.row');
        cabHTML = firstRow ? Array.prototype.map.call(firstRow.querySelectorAll('.cab'), function (c) { return c.outerHTML; }).join('') : '';
      }
      // 每一層的隔間一樣寬:改 DOM 之前量一次就好。
      // 邊改邊量的話,每量一次瀏覽器就得把整頁的 3D 書重排一次(手機上切換排法因此卡 0.5 秒)
      var first = root.querySelector('[data-bay]');
      if (!first) return;
      // 先讀、再改:寬度、封面基準、每排的留白與間距都在搬動 DOM 之前讀好
      var avail = first.clientWidth - PAD;
      var wBefore = root.style.getPropertyValue('--w');
      var m = rowMetrics(first);
      var w = fitWidth(avail, baseWidth());
      if (wBefore !== w + 'px') m = null;   // 封面寬變了(視窗寬度改變):最小高度跟著變,算高度時再重讀
      var list = Array.prototype.slice.call(bays || root.querySelectorAll('[data-bay]'));
      list.forEach(function (bay) {
        var books = Array.prototype.slice.call(bay.querySelectorAll('.b3'));
        var lines = [], line = [], used = 0;
        books.forEach(function (b) {
          var slot = forView === 'covers' ? w : parseFloat(b.style.getPropertyValue('--t'));
          if (line.length && used + slot > avail) { lines.push(line); line = []; used = 0; }
          line.push(b); used += slot + GAP;
        });
        if (line.length) lines.push(line);
        // 行數沒變就不動 DOM,避免打斷進行中的動畫
        var rows = bay.querySelectorAll('.row');
        var same = rows.length === lines.length && lines.every(function (l, i) { return rows[i].querySelectorAll('.b3').length === l.length && rows[i].contains(l[0]); });
        if (same) return;
        bay.textContent = '';
        lines.forEach(function (l) {
          // 每排外面包一層 .row-wrap,content-visibility 加在那裡(.row 是 3D 空間,不能被壓平,見 books.css)
          var wrap = document.createElement('div');
          wrap.className = 'row-wrap';
          var row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = cabHTML;
          l.forEach(function (b, i) { b.style.setProperty('--i', i); row.appendChild(b); });
          wrap.appendChild(row);
          bay.appendChild(wrap);
        });
      });
      sizeRows(list, w, m || rowMetrics(first));
    };

    // 畫面外的排不排版、不繪製(books.css 的 content-visibility: auto),但瀏覽器得知道它多高,捲軸才不會跳。
    // 高度用算的,不實際排版去量:一排的內容高度 = max(最小高度, 最高那本書),書高 = 封面寬 ÷ 封面比例(--ratio)。
    // 最小高度跟著封面寬變,從 CSS 讀(只讀樣式;要在搬動 DOM 之前讀,不然瀏覽器得先把全部書的樣式重算一遍)
    // 每排的上方留白、最小高度、下緣(層板前緣的空間):最小高度跟著封面寬變
    function rowMetrics(bay) {
      var row = bay.querySelector('.row');
      if (!row) return null;
      var cs = getComputedStyle(row);
      return { pad: parseFloat(cs.paddingTop) || 0, minH: parseFloat(cs.minHeight) || 0, below: parseFloat(cs.marginBottom) || 0 };
    }
    // 高度寫在每排外面那一層 .row-wrap(content-visibility 加在那裡,見 books.css)。
    // 外層的內容 = 排的上方留白 + max(最小高度, 最高那本書) + 下緣;.row 是 content-box,min-height 不含 padding
    function sizeRows(bays, w, m) {
      if (!m) return;
      bays.forEach(function (bay) {
        bay.querySelectorAll('.row-wrap > .row').forEach(function (row) {
          var tallest = 0;
          row.querySelectorAll('.b3').forEach(function (b) { tallest = Math.max(tallest, w / parseFloat(b.style.getPropertyValue('--ratio'))); });
          row.parentNode.style.containIntrinsicSize = 'auto ' + (m.pad + Math.max(m.minH, tallest) + m.below) + 'px';
        });
      });
    }

    // 第一次分格時不播放寬度的過場;books.js 初始化完成後拿掉
    root.classList.add('no-anim');
  })();
</script>

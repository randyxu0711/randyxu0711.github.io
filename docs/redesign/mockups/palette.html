<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪報桌色票</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：每組色票一段，色票條 + 晝夜兩個實物樣本並排；頁面本身保持安靜，顏色只出現在樣本裡 */
:root {
  --bg: #f4f4f2; --fg: #1a1a19; --fg-2: #5d5d5a; --rule: #d9d9d4; --chip: #ffffff;
  --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", system-ui, sans-serif;
  --f-display: "Iowan Old Style", Charter, Georgia, "Songti TC", "Noto Serif CJK TC", "PMingLiU", serif;
  --f-code: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161615; --fg: #ebeae6; --fg-2: #9b9a95; --rule: #2e2e2c; --chip: #222220; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #161615; --fg: #ebeae6; --fg-2: #9b9a95; --rule: #2e2e2c; --chip: #222220; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-ui); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 40px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 600 1.9rem/1.25 var(--f-display); margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--fg-2); max-width: 62ch; margin: 0; }
section { border-top: 1px solid var(--rule); margin-top: 44px; padding-top: 28px; display: grid; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.head h2 { font: 600 1.35rem/1.3 var(--f-display); margin: 0; }
.head .src { font: 0.8rem var(--f-code); color: var(--fg-2); }
.why { margin: 0; max-width: 70ch; color: var(--fg-2); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { display: flex; align-items: center; gap: 8px; background: var(--chip); border: 1px solid var(--rule);
  border-radius: 6px; padding: 4px 10px 4px 4px; font-size: 0.8rem; }
.sw i { width: 22px; height: 22px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
.sw code { font: 0.72rem var(--f-code); color: var(--fg-2); }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 14px; }

/* ── 樣本：用色票自己的變數，跟頁面主題無關 ── */
.scene { --th: 4px; background: var(--desk); color: var(--ink); border-radius: 10px; padding: 18px;
  display: grid; gap: 18px; min-width: 0; position: relative; overflow: hidden; }
.scene .mode { position: absolute; top: 12px; right: 14px; font: 0.7rem var(--f-code); color: var(--ink2); letter-spacing: .08em; }
.nav { display: flex; align-items: baseline; gap: 16px; font-size: 0.85rem; color: var(--ink2); }
.nav b { font: italic 600 1.05rem var(--f-display); color: var(--ink); margin-right: auto; }
.nav .on { color: var(--sig); box-shadow: 0 2px 0 var(--sig); }
.row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }

.slab { background: var(--face); border-radius: 5px;
  box-shadow: inset 0 1px 0 var(--spec), 0 var(--th) 0 var(--edge), 0 calc(var(--th) + 3px) 10px var(--drop); }
.card { width: 200px; position: relative; margin-top: 12px; }
.tabs { position: absolute; top: -11px; left: 10px; display: flex; gap: 3px; }
.tabs span { width: 26px; height: 12px; border-radius: 3px 3px 0 0; }
.img { height: 92px; border-radius: 5px 5px 0 0; background:
  linear-gradient(135deg, transparent 52%, rgb(255 255 255 / .1) 52%),
  linear-gradient(160deg, #2b3a4a 0%, #3f5f73 55%, #c9a35b 100%); }
.txt { padding: 9px 11px 11px; display: grid; gap: 6px; }
.ttl { font: 600 0.92rem/1.3 var(--f-display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; align-items: center; gap: 8px; font: 0.68rem var(--f-code); color: var(--ink2); }
.stamp { border: 1.5px solid currentColor; border-radius: 3px; padding: 0 4px; font-weight: 600; }
.meta .seen { color: var(--sig); margin-left: auto; font-size: 0.8rem; }
.sticky { position: absolute; right: -12px; bottom: -14px; width: 92px; padding: 7px 8px; background: var(--sticky);
  color: #2a2618; font-size: 0.68rem; line-height: 1.35; transform: rotate(3deg); box-shadow: 0 3px 6px var(--drop); }
.redline { position: absolute; top: 58px; left: 12px; color: var(--red); border: 2px solid currentColor; border-radius: 4px;
  padding: 0 6px; font: 700 0.72rem var(--f-ui); letter-spacing: .15em; transform: rotate(-6deg); background: rgb(255 255 255 / .55); }

.side { display: grid; gap: 14px; flex: 1; min-width: 160px; }
.drawer { background: var(--shelf); border-radius: 4px; padding: 10px 12px 12px; display: grid; gap: 8px; justify-items: center;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 3px 0 var(--shelf-edge), 0 6px 10px var(--drop); }
.drawer .strip { height: 4px; width: 100%; border-radius: 2px; }
.drawer .label { background: var(--face); color: var(--ink); font-size: 0.72rem; padding: 2px 10px; border-radius: 2px;
  box-shadow: inset 0 0 0 1.5px var(--shelf-edge); }
.drawer .pull { width: 34px; height: 7px; border-radius: 4px; background: var(--shelf-edge); }
.drawers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.books { display: flex; align-items: flex-end; gap: 2px; padding: 0 6px; border-bottom: 6px solid var(--shelf);
  box-shadow: 0 3px 0 var(--shelf-edge); height: 76px; }
.books span { width: 13px; border-radius: 1px 1px 0 0; box-shadow: inset -2px 0 0 rgb(0 0 0 / .15); }
.keys { display: flex; gap: 8px; flex-wrap: wrap; }
.key { --th: 2px; font-size: 0.74rem; padding: 3px 10px; color: var(--ink2); }
.key.down { --th: 0px; background: var(--sig-face); color: var(--ink); transform: translateY(2px);
  box-shadow: inset 0 1px 2px var(--drop), 0 0 0 1px var(--sig-edge); }
.key.hover { box-shadow: inset 0 1px 0 var(--spec), 0 2px 0 var(--sig-edge), 0 5px 8px var(--drop); }
.para { font-size: 0.8rem; color: var(--ink2); margin: 0; }
.para a { color: var(--sig); text-decoration: underline; text-underline-offset: 2px; }

.note { margin-top: 48px; border-top: 1px solid var(--rule); padding-top: 24px; display: grid; gap: 10px; max-width: 70ch; }
.note h2 { font: 600 1.15rem var(--f-display); margin: 0; }
.note p { margin: 0; color: var(--fg-2); }

.scene.night { cursor: crosshair; touch-action: pan-y; }
.scene .dim, .scene .glow, .scene .curtain { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.scene .dim { mix-blend-mode: multiply; background: radial-gradient(circle 170px at var(--mx, 30%) var(--my, 55%), var(--lamp) 0%, color-mix(in srgb, var(--lamp) 55%, #666) 45%, #666 100%); }
.scene .glow { mix-blend-mode: screen; background: radial-gradient(circle 120px at var(--mx, 30%) var(--my, 55%), color-mix(in srgb, var(--lamp) 22%, transparent), transparent 70%); }
.scene .curtain { background: var(--unlit); opacity: 0; }
.scene.off .dim { background: #666; }
.scene.off .glow { opacity: 0; }
.scene.off .curtain { opacity: 1; }
.scene.boot .curtain { animation: curtain 1.1s ease-out forwards; }
.scene.boot .dim, .scene.boot .glow { animation: flicker 1.5s steps(1, end) forwards; }
@keyframes curtain { 0% { opacity: 1 } 45% { opacity: .9 } 100% { opacity: 0 } }
@keyframes flicker { 0%, 55% { opacity: 0 } 62% { opacity: 1 } 68% { opacity: .1 } 76% { opacity: 1 } 82% { opacity: .2 } 90%, 100% { opacity: 1 } }
.scene.boot .dim { animation-name: flickerDim; }
@keyframes flickerDim { 0%, 55% { background: #666 } 62%, 76%, 90%, 100% { background: radial-gradient(circle 170px at var(--mx, 30%) var(--my, 55%), var(--lamp) 0%, color-mix(in srgb, var(--lamp) 55%, #666) 45%, #666 100%) } 68%, 82% { background: #666 } }
.replay { position: absolute; z-index: 4; bottom: 10px; right: 12px; font: 0.72rem var(--f-ui); color: var(--ink); background: rgb(0 0 0 / .35);
  border: 1px solid rgb(255 255 255 / .25); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
.replay:focus-visible { outline: 2px solid var(--sig); outline-offset: 2px; }
.scene .mode { z-index: 4; }
@media (prefers-reduced-motion: reduce) { .scene.boot .curtain, .scene.boot .dim, .scene.boot .glow { animation: none; } .scene.boot .curtain { opacity: 0 } }
</style>

<div class="wrap">
  <h1>剪報桌色票</h1>
  <p class="lede">最後三選。白天都用和田三造《配色事典》#249 的奶油色（Ecru + Hay's Russet），差別只在夜間。夜間的樣本模擬了網站真正的樣子：開場先是關燈的暗幕，檯燈閃兩下才亮；檯燈照不到的地方只剩 40% 亮度，檯燈的顏色從配色的側面色推出來。滑鼠移到夜間樣本上，檯燈會跟著走（手機點一下）。</p>
  <div id="list"></div>
  <div class="note">
    <h2>怎麼看</h2>
    <p>白天三組一樣，只需要看夜間：暗幕的顏色、檯燈照不到的地方、檯燈照到卡片和書時的顏色。暖色的燈打在冷色牆面上，顏色會互相抵消變灰；打在棕色上則會發亮。檯燈與暗幕是用 CSS 模擬的，跟 shader 的算法相同但不完全一樣，選定後會在真的場景裡再確認一次。</p>
  </div>
</div>

<script>
const DAY = { desk:'#e9dfcb', face:'#f7f0e1', edge:'#cdb999', shelf:'#b3a185', shelfEdge:'#8f7e64', ink:'#2a1f19', ink2:'#5c4f45', sig:'#793327', sigFace:'#efdcd6', sigEdge:'#a8574a', red:'#a2402f', sticky:'#ecd791', tags:['#793327','#547076','#d6b43e','#806e4b','#42533e'] };
const P = [
  { id: 'leather', name: '皮革棕', src: '夜：和田 #113 Vandyke Brown ・ #249 Hay\'s Russet', why: '深咖啡皮革色的牆面，跟白天的赤褐同一個色系。暖燈打在棕色上會發亮，像皮沙發旁的閱讀燈。暗幕是近黑的深棕，開燈前跟原本的黑幾乎一樣。',
    day: DAY,
    night: { desk:'#221812', face:'#30241b', edge:'#4b3827', shelf:'#3a2b1f', shelfEdge:'#281d14', ink:'#f0e3cc', ink2:'#b5a28a', sig:'#e3a07c', sigFace:'#3d2a1f', sigEdge:'#a8623c', red:'#e08a74', sticky:'#c9a95a', unlit:'#0c0806', lamp:'#ffd29a', tags:['#e0957e','#9fbac0','#d9b84a','#c0a07a','#9fb08f'] },
    sw: [['夜 牆面','n:desk'],['夜 卡片','n:face'],['夜 暗幕','n:unlit'],['檯燈','n:lamp'],['夜 訊號','n:sig']] },
  { id: 'medici', name: '灰藍', src: '夜：和田 #249 Dark Medici Blue', why: '上一輪你選的第一組。灰藍牆面最有個性，但暖燈照上去，冷暖互相抵消，燈下會偏灰褐。檯燈改成偏白的暖光來減少這個問題。',
    day: DAY,
    night: { desk:'#1a2427', face:'#263236', edge:'#3a484c', shelf:'#2f3c40', shelfEdge:'#1f292c', ink:'#efe3cc', ink2:'#a9b0a8', sig:'#e0a08f', sigFace:'#3a2c2a', sigEdge:'#9a5546', red:'#d98a7c', sticky:'#c7ad5a', unlit:'#080c0e', lamp:'#ffe2bc', tags:['#d98a7c','#8fb0b8','#d6b43e','#b39d76','#8fa688'] },
    sw: [['夜 牆面','n:desk'],['夜 卡片','n:face'],['夜 暗幕','n:unlit'],['檯燈','n:lamp'],['夜 訊號','n:sig']] },
  { id: 'char', name: '暖炭黑', src: '夜：和田 #323 Black + Madder Brown', why: '最接近現在的黑，只是帶一點赤褐的暖。顏色幾乎全部交給檯燈和卡片，關燈效果最戲劇化，但白天的奶油色到了晚上最難感覺到。',
    day: DAY,
    night: { desk:'#171412', face:'#25201c', edge:'#3d342c', shelf:'#2b2520', shelfEdge:'#1c1815', ink:'#ede3d0', ink2:'#a59a8b', sig:'#e0a08f', sigFace:'#3a2a26', sigEdge:'#9a5546', red:'#d98a7c', sticky:'#c2a85a', unlit:'#070605', lamp:'#ffd8a8', tags:['#d98a7c','#8fb0b8','#d6b43e','#b39d76','#8fa688'] },
    sw: [['夜 牆面','n:desk'],['夜 卡片','n:face'],['夜 暗幕','n:unlit'],['檯燈','n:lamp'],['夜 訊號','n:sig']] },
];
const BOOKS = [['#2d4a6b',64],['#b8352e',70],['#e8dcc0',58],['#1f1f1f',72],['#6b8e5a',61],['#d9a441',67],['#5a3d5c',55],['#ece8e0',69],['#24555a',63]];
const isDark = h => { const n = parseInt(h.slice(1), 16); return ((n >> 16) * .3 + ((n >> 8) & 255) * .59 + (n & 255) * .11) < 110; };

const scene = (c, label) => {
  const v = `--desk:${c.desk};--face:${c.face};--edge:${c.edge};--shelf:${c.shelf};--shelf-edge:${c.shelfEdge};--ink:${c.ink};--ink2:${c.ink2};--sig:${c.sig};--sig-face:${c.sigFace};--sig-edge:${c.sigEdge};--red:${c.red};--sticky:${c.sticky};`
    + (label === '夜' ? `--spec:rgb(255 255 255 / .08);--drop:rgb(0 0 0 / .5);--unlit:${c.unlit};--lamp:${c.lamp};` : '--spec:rgb(255 255 255 / .9);--drop:rgb(30 30 40 / .22);');
  const t = c.tags;
  return `<div class="scene${label === '夜' ? ' night off' : ''}" style="${v}">
    <span class="mode">${label}</span>
    <div class="nav"><b>Randy Xu</b><span class="on">分享</span><span>書單</span><span>關於</span></div>
    <div class="row">
      <div class="card slab">
        <div class="tabs"><span style="background:${t[0]}"></span><span style="background:${t[1]}"></span><span style="background:${t[2]}"></span></div>
        <div class="img"></div>
        <div class="txt">
          <div class="ttl">Automating Data Ingestion with a RAG Flywheel</div>
          <div class="meta"><span class="stamp" style="color:${t[0]}">zalando</span><span>10.14</span><span>#46</span><span class="seen">✓</span></div>
        </div>
        <span class="redline">封存</span>
        <div class="sticky">飛輪的回饋迴圈值得學，ingestion 自己會變好</div>
      </div>
      <div class="side">
        <div class="drawers">
          <div class="drawer"><div class="strip" style="background:${t[0]}"></div><span class="label">AI/LLM 18</span><span class="pull"></span></div>
          <div class="drawer"><div class="strip" style="background:${t[3]}"></div><span class="label">Frontend 9</span><span class="pull"></span></div>
        </div>
        <div class="books">${BOOKS.map(([b, h]) => `<span style="background:${b};height:${h}px"></span>`).join('')}</div>
        <div class="keys"><span class="key slab">最新</span><span class="key slab down">依 tag</span><span class="key slab hover">來源</span></div>
        <p class="para">來自 <a>engineering.zalando.com</a>，另開分頁讀原文。</p>
      </div>
    </div>
    ${label === '夜' ? '<div class="dim"></div><div class="glow"></div><div class="curtain"></div><button class="replay" type="button">重播開燈</button>' : ''}
  </div>`;
};

document.getElementById('list').innerHTML = P.map(p => {
  const sw = p.sw.map(([n, k]) => { const col = k.startsWith('n:') ? p.night[k.slice(2)] : p.day[k];
    return `<span class="sw"><i style="background:${col}"></i>${n}<code>${col}</code></span>`; }).join('')
    + `<span class="sw"><i style="background:linear-gradient(90deg,${p.night.tags.join(',')})"></i>夜 標籤五色</span>`;
  return `<section id="${p.id}">
    <div class="head"><h2>${p.name}</h2><span class="src">${p.src}</span></div>
    <p class="why">${p.why}</p>
    <div class="swatches">${sw}</div>
    <div class="pair">${scene(p.day, '晝')}${scene(p.night, '夜')}</div>
  </section>`;
}).join('');

const boot = el => { el.classList.remove('boot', 'off'); void el.offsetWidth; el.classList.add('boot'); };
const nights = [...document.querySelectorAll('.scene.night')];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { boot(e.target); io.unobserve(e.target); } }), { threshold: .4 });
nights.forEach(el => {
  io.observe(el);
  el.querySelector('.replay').addEventListener('click', () => boot(el));
  el.addEventListener('pointermove', ev => {
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', `${ev.clientX - r.left}px`);
    el.style.setProperty('--my', `${ev.clientY - r.top}px`);
  });
});
setTimeout(() => nights.forEach(el => el.classList.contains('off') && boot(el)), 4000);
</script>

# 站台設定。個人資料都放這裡或 _data/,版面裡不寫死。

lang: zh-TW
timezone: Asia/Taipei

title: Randy Xu
description: >-
  Randy Xu 的個人頁:自己的 projects,與轉發的技術文章。
url: "https://randyxu0711.github.io"
baseurl: ""

author:
  name: Randy Xu
  email: randy970711@gmail.com
github:
  username: randyxu0711

nav:
  - { title: 分享, key: nav.shares, url: / }
  - { title: 書架, key: nav.books, url: /books/, module: books }
  - { title: 關於, key: nav.about, url: /about/ }

appearance:
  hue: 72          # 琥珀色相
  mode: system     # system / light / dark,訪客可再切換
  thickness: 4px   # 一般卡片的厚度(精選 7px、按鍵 2px)

modules:           # 註解掉一行 = 關掉一個功能
  shelf-filter: { slots: [before-shelf] }
  seen:         { slots: [card-meta, footer] }
  archive:      { slots: [card-meta] }
  books:        { slots: [] }

books:
  default_view: covers   # spines / covers
  hide_shelf: hide

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:              # share 不產生內部頁:見 _plugins/no-post-output.rb
  tabs:
    output: true
    sort_by: order

defaults:
  - scope: { path: "", type: tabs }
    values: { layout: page, permalink: /:title/ }

exclude:
  - docs
  - tools
  - books/            # 只排除放 CSV 的目錄;寫成 books 會連 books.md 一起排除
  - CLAUDE.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - "*.gem"
  - "*.gemspec"

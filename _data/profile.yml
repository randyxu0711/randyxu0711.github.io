exploring:
  - title:
      zh: 怎麼讓 AI agent 可控、可驗證
      en: Making AI agents controllable and verifiable
    text:
      zh: 用 Claude Agent SDK 做多 agent 應用,想的是怎麼讓 AI 的每句話都有出處、權限不越界,以及怎麼把 AI 和可測試的程式邏輯分開。
      en: Building multi-agent apps with the Claude Agent SDK — every claim the AI makes should have a source, permissions should never overreach, and AI output should stay separate from testable program logic.
  - title:
      zh: 讀開源 agent 框架的原始碼
      en: Reading open-source agent frameworks
    text:
      zh: 例如 Hermes Agent 的上下文壓縮、技能系統與自主學習機制,也替它寫了自訂技能。
      en: E.g. context compression, the skill system and self-learning in Hermes Agent, for which I've also written custom skills.

experience:
  - org:   { zh: Openfind 網擎資訊, en: Openfind }
    title: { zh: Software Engineer, en: Software Engineer }
    when:  { zh: 2021/10 – 2024/4, en: Oct 2021 – Apr 2024 }
    lead:
      zh: 企業郵件系統 Mail2000 核心開發。
      en: Core developer on Mail2000, an enterprise email system.
    # 每一點:效益當標題,後面說明誰得到什麼;不寫技術細節(**粗體** 會轉成標題)
    items:
      zh:
        - "**新舊介面共用同一套後端**:負責新功能開發與既有功能的架構轉換。新版介面上線時不必重寫功能,團隊只需維護一份邏輯;客戶的開發團隊也能直接串接,把郵件功能整合進自家系統。"
        - "**單台故障不影響服務**:建立自動容錯切換,伺服器出問題時由備援機接手。客戶少了停機,維運人員也不必手動介入。"
        - "**安全又順手的登入**:雙因素驗證可以用手機確認或生物辨識完成,強化帳號安全,登入卻不變麻煩。"
        - "**換系統不換習慣**:開發 Outlook 同步工具。企業轉換到 Mail2000 之後,員工照樣用熟悉的 Outlook 收信、排行程、找聯絡人,轉換過程無痛。"
      en:
        - "**One backend for old and new interfaces**: built new features and migrated existing ones to a shared backend. The new interface launched without rewriting features, the team maintains one codebase, and customers' developers can integrate mail into their own systems."
        - "**No outage from a single server failure**: set up automatic failover so a standby takes over when a server fails. Customers avoid downtime, and operators don't have to step in."
        - "**Sign-in that is secure and still easy**: two-factor sign-in can be confirmed on a phone or with biometrics, strengthening account security without making sign-in a chore."
        - "**Switch systems, keep habits**: built the Outlook sync tool. After a company moves to Mail2000, employees keep using Outlook for mail, calendars and contacts, so the switch is painless."


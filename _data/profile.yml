name: Randy Xu
avatar: /assets/img/avatar.jpg

role:
  zh: 軟體工程師，探索可驗證的 AI agent 應用
  en: Software engineer exploring verifiable AI agent applications

intro:   # 一段一個重點:你是誰、現在在做什麼、工作之外
  zh:
    - 我是 Randy，軟體工程師。在 Openfind 的兩年半，負責企業郵件系統 Mail2000 的核心開發：把既有功能轉到共用的後端、讓伺服器出事時由備援機自動接手，也做了雙因素登入，以及讓企業換系統後員工照樣用 Outlook 的同步工具。
    - 現在專注在 AI agent，關心的是怎麼讓 AI 的輸出可以驗證、可以測試，而不只是看起來對。hyenovel 用兩個隔離的 agent 分析與評論短篇小說，每條論點都要通過程式的原文比對。
    - 工作之外，我讀世界經典文學，偶爾也寫短篇。這個網站收錄我的 projects、值得一讀的技術文章，以及讀過的書。
  en:
    - I'm Randy, a software engineer. For two and a half years at Openfind I worked on the core of Mail2000, an enterprise email system — moving existing features onto a shared backend, automatic failover to a standby server, two-factor sign-in, and a sync tool that lets employees keep using Outlook after their company switches over.
    - These days I focus on AI agents, and on making their output verifiable and testable rather than merely plausible. hyenovel has two isolated agents analyze and critique short fiction, and every claim must pass a programmatic check against the original text.
    - Outside of work I read world classic literature and occasionally write short stories. This site collects my projects, technical articles worth reading, and the books I've read.


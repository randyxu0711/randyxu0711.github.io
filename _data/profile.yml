    - Hi, I'm Randy, a software engineer. I spent two and a half years on the core of Mail2000, Openfind's enterprise email system; these days I'm researching applications of AI agents, and building things I find interesting along the way.
    - Outside of work I read world classic literature and occasionally write short stories. This site collects my projects, technical articles worth reading, and the books I've read.


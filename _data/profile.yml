exploring:
  - title:
      zh: 讓 AI agent 可控、可驗證
      en: Making AI agents controllable and verifiable
    text:
      zh: 把 LLM 的判斷和確定性的程式分開：LLM 只輸出符合 schema 的 JSON，由程式驗證格式與引用，沒過就帶著錯誤明細重試；權限用工具白名單加 hook 兩層擋，不只靠模型自律。
      en: Keep LLM judgment apart from deterministic code. The model only emits JSON that fits a schema; code validates the shape and every citation, and failures go back with the error details for a retry. Permissions are enforced twice — a tool allowlist plus hooks — instead of trusting the model to behave.
  - title:
      zh: 用 Claude Agent SDK 打造多 agent 執行框架
      en: A multi-agent harness on the Claude Agent SDK
    text:
      zh: hyenovel 的後端直接用 ClaudeSDKClient 自己做編排：每個 agent 各開一個 client，工具白名單、可寫入的路徑與輪數上限分開設定；流程控制交給確定性的程式，負責派工、跑閘門、遇到服務過載就退避重試。認證走 Claude 訂閱而不是 API key，每一輪的 token 與快取用量都記進帳本，介面上看得到每一篇、每個階段花了多少。
      en: hyenovel's backend orchestrates agents directly with ClaudeSDKClient. Each agent gets its own client with its own tool allowlist, writable paths and turn limit; deterministic code owns the control flow — dispatching work, running the gates, and backing off when the service is overloaded. It authenticates through a Claude subscription rather than an API key, and every turn's token and cache usage goes into a ledger, so the UI shows what each story and each phase cost.
  - title:
      zh: 資訊不完全遊戲的 AI 教練
      en: An AI coach for imperfect-information games
    text:
      zh: 以日本麻將為題，讓 agent 輔助玩家互動討論、學習每一手背後的策略邏輯：在規則之下，哪個選擇的期望收益比較高。程式先重放牌局、逐步核對，再把資訊切成「當下看得到的」與「事後才揭曉的」；負責解說的 agent 只拿得到前者，避免拿結果倒推道理。
      en: Using Japanese mahjong, an agent helps players discuss and learn the strategy behind each move — which choice has the higher expected value under the rules. Code first replays the game and checks every step, then splits information into what was visible at the time and what was only revealed later; the explaining agent only ever sees the former, so it can't reason backwards from the outcome.
  - title:
      zh: Hermes Agent
      en: Hermes Agent
    text:
      zh: 讀過 Hermes Agent 的原始碼，研究它的上下文壓縮、技能系統與自主學習機制，也替它寫了文學分析與故事管理的技能：先用 SQLite 全文檢索，後來改接 MemPalace 的語意記憶與知識圖譜。這是 hyenovel 的前身；後來改用 Claude Agent SDK 的 client 重寫，走 Claude 訂閱，並自己記錄與管理每一輪的用量。
      en: I read through Hermes Agent's source, covering its context compression, skill system and self-learning, and wrote literary-analysis and story-management skills for it, first on SQLite full-text search and later on MemPalace's semantic memory and knowledge graph. That work was hyenovel's predecessor, which I later rewrote on the Claude Agent SDK client, running on a Claude subscription and tracking the usage of every turn myself.

experience:
  - org:   { zh: Openfind 網擎資訊, en: Openfind }

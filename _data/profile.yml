exploring:   # 書房近況裡的研究方向,一項一句
  - title: { zh: 讓 AI agent 可控、可驗證, en: Making AI agents controllable and verifiable }
    text:
      zh: LLM 只負責判斷；格式、引用與權限交給程式驗證，沒過就帶著錯誤明細重試。
      en: "The LLM only makes judgment calls; code checks the format, the citations and the permissions, and failures go back with the errors for a retry."
  - title: { zh: 用 Claude Agent SDK 打造多 agent 執行框架, en: A multi-agent harness on the Claude Agent SDK }
    text:
      zh: 每個 agent 各有工具白名單、可寫路徑與輪數上限，流程交給確定性的程式，每一輪的用量都記進帳本。
      en: "Each agent has its own tool allowlist, writable paths and turn limit; deterministic code runs the flow, and every turn's usage goes into a ledger."
  - title: { zh: 資訊不完全遊戲的 AI 教練, en: An AI coach for imperfect-information games }
    text:
      zh: 以日本麻將為題，解說的 agent 只看得到當下可見的資訊，不能拿結果倒推道理。
      en: "Japanese mahjong as the subject: the explaining agent only sees what was visible at the time, so it can't reason backwards from the outcome."
  - title: { zh: Hermes Agent, en: Hermes Agent }
    text:
      zh: 讀過它的原始碼，替它寫文學分析技能、接 MemPalace 語意記憶與 Spotify 的 MCP server；這是 hyenovel 的前身。
      en: "Read its source, wrote literary-analysis skills for it on MemPalace's semantic memory, and hooked it up to Spotify's MCP server; it was hyenovel's predecessor."

experience:
  - org:   { zh: 獨立開發, en: Independent }
    title: { zh: AI Agent Developer, en: AI Agent Developer }
    when:  { zh: 2024/4 – 至今, en: Apr 2024 – Present }
    lead:
      zh: 以 Claude Agent SDK 開發 LLM agent 應用，主要作品是上方的 hyenovel。
      en: Building LLM agent applications on the Claude Agent SDK; hyenovel above is the main one.
  - org:   { zh: Openfind 網擎資訊, en: Openfind }
    title: { zh: Software Engineer, en: Software Engineer }
    when:  { zh: 2021/10 – 2024/4, en: Oct 2021 – Apr 2024 }
    lead:
      zh: 企業郵件平台 Mail2000 核心開發，平台授權使用者超過一千萬。
      en: Core developer on Mail2000, an enterprise email platform with 10M+ licensed users.
    # 每一點:**標題** 是做了什麼,冒號後面用業界術語寫做法與規模;跟 docs/resume/resume.typ 的說法一致
    items:
      zh:
        - "**舊系統現代化**:把 30 多支 C 語言 CGI 程式重構成共用函式庫，並在上面建立 REST API 層，網頁介面、手機 App 與客戶的系統整合共用同一套後端。"
        - "**Exchange 移轉**:負責 C# 的 Windows 用戶端，透過 MAPI（Redemption 函式庫）與 Mail2000 同步 Outlook 的郵件、聯絡人與行事曆，服務從 Exchange 移轉過來的客戶，使用者超過一萬人。"
        - "**雙因素驗證（2FA）**:負責登入流程與合作夥伴驗證 API 的整合，支援 OTP 動態密碼與推播核准。"
        - "**高可用性**:負責容錯切換模組，用 Perl 串接 keepalived（VRRP）、lsyncd 檔案同步與 MongoDB replica set，主機故障時備援機約 10 秒內接手。"
      en:
        - "**Legacy system modernization**: Refactored 30+ legacy C CGI programs into shared libraries and built a REST API layer on top, so the web UI, mobile app and customer integrations share one backend."
        - "**Exchange migration**: Owned a C# Windows client that syncs Outlook mail, contacts and calendars with Mail2000 over MAPI (Redemption library), used by 10,000+ end users at customers migrating off Exchange."
        - "**Two-factor authentication (2FA)**: Owned the login integration with a partner's authentication API, supporting OTP codes and push-notification approval."
        - "**High availability**: Owned the failover module, Perl scripts driving keepalived (VRRP), lsyncd file replication and MongoDB replica sets; the standby takes over within ~10 seconds."


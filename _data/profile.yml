    - Hi, I'm Randy, an AI engineer and full-stack developer. I spent two and a half years on the core of Mail2000, Openfind's enterprise email platform with 10M+ licensed users. Since 2024 I've been building LLM agent applications on the Claude Agent SDK, with a focus on keeping them verifiable and cost-aware.
    - Outside of work I read world classic literature and occasionally write short stories. This site collects my projects, technical articles worth reading, and the books I've read.


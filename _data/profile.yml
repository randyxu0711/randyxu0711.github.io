exploring:   # 書房近況裡的研究方向,一項一句
  - title: { zh: 讓 AI agent 可控、可驗證, en: Making AI agents controllable and verifiable }
    text:
      zh: LLM 只負責判斷；格式、引用與權限交給程式驗證，沒過就帶著錯誤明細重試。
      en: "The LLM only makes judgment calls; code checks the format, the citations and the permissions, and failures go back with the errors for a retry."
  - title: { zh: 用 Claude Agent SDK 打造多 agent 執行框架, en: A multi-agent harness on the Claude Agent SDK }
    text:
      zh: 每個 agent 各有工具白名單、可寫路徑與輪數上限，流程交給確定性的程式，每一輪的用量都記進帳本。
      en: "Each agent has its own tool allowlist, writable paths and turn limit; deterministic code runs the flow, and every turn's usage goes into a ledger."
  - title: { zh: 資訊不完全遊戲的 AI 教練, en: An AI coach for imperfect-information games }
    text:
      zh: 以日本麻將為題，解說的 agent 只看得到當下可見的資訊，不能拿結果倒推道理。
      en: "Japanese mahjong as the subject: the explaining agent only sees what was visible at the time, so it can't reason backwards from the outcome."
  - title: { zh: Hermes Agent, en: Hermes Agent }
    text:
      zh: 讀過它的原始碼，替它寫文學分析技能、接 MemPalace 語意記憶與 Spotify 的 MCP server；這是 hyenovel 的前身。
      en: "Read its source, wrote literary-analysis skills for it on MemPalace's semantic memory, and hooked it up to Spotify's MCP server; it was hyenovel's predecessor."

experience:
  - org:   { zh: Openfind 網擎資訊, en: Openfind }
    title: { zh: Software Engineer, en: Software Engineer }
    when:  { zh: 2021/10 – 2024/4, en: Oct 2021 – Apr 2024 }
    lead:
      zh: 企業郵件系統 Mail2000 核心開發。
      en: Core developer on Mail2000, an enterprise email system.
    # 每一點:**標題** 是做了什麼(整體一點),冒號後面寫對使用者與團隊的好處,不寫技術細節
    items:
      zh:
        - "**系統開發與架構轉型**:負責新功能開發與既有功能的架構轉換。新版介面上線時不必重寫功能,團隊只需維護一份邏輯;客戶的開發團隊也能直接串接,把郵件功能整合進自家系統。"
        - "**自動容錯切換**:伺服器出問題時由備援機自動接手。在維運人員接手排查之前,服務不中斷、有保障。"
        - "**雙因素登入**:讓使用者透過手機 App 完成驗證,安全、方便一把抓。"
        - "**無痛轉移方案**:開發 Outlook 同步工具。企業轉換到 Mail2000 之後,員工照樣用熟悉的 Outlook 收信、排行程、找聯絡人。"
      en:
        - "**Feature development and architecture migration**: Built new features and migrated existing ones to a shared backend. The new interface launched without rewriting features, the team maintains one codebase, and customers' developers can integrate mail into their own systems."
        - "**Automatic failover**: A standby takes over automatically when a server fails, so service keeps running until operators step in to investigate."
        - "**Two-factor sign-in**: Users verify through a mobile app, getting security and convenience in one step."
        - "**Seamless migration**: Built the Outlook sync tool. After a company moves to Mail2000, employees keep using Outlook for mail, calendars and contacts."


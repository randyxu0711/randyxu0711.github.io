intro:   # 一段一個重點:你是誰、現在在做什麼、工作之外
  zh:
    - 我是 Randy,軟體工程師。曾在 Openfind 負責企業郵件系統 Mail2000 的核心開發。
    - 現在專注於 AI agent 相關項目,嘗試做一些有趣的 AI 應用。
    - 工作之外,我讀世界經典文學。這裡收錄我的 projects、值得一讀的技術文章,以及讀過的書。
  en:
    - I'm Randy, a software engineer. At Openfind I worked on the core of Mail2000, an enterprise email system.
    - These days I focus on AI agent projects, experimenting with interesting AI applications.
    - Outside of work, I read world classic literature. This site collects my projects, technical articles worth reading, and the books I've read.

